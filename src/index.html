      <div class="setup-hero">
        <div class="card-brand"><img src="assets/icon.png" alt=""><span>onigiri</span></div>

      </div>

      <div id="setup-config-notice" class="setup-notice" hidden>
        Add a Supabase URL and key in <button type="button" id="setup-notice-settings-link" class="link-btn">Settings</button> first — see README.
      </div>

      <div class="setup-cards">
        <form id="host-form" class="card setup-card">

          <p class="card-sub">Get a room code to share.</p>
          <label class="field">
            <span>Your name</span>
            <input type="text" id="host-username" required autocomplete="off">
          </label>
          <button type="submit" class="btn btn-filled">Create room</button>
        </form>

        <form id="join-form" class="card setup-card">

          <p class="card-sub">Enter your host's room code.</p>
          <label class="field">
            <span>Your name</span>
            <input type="text" id="join-username" required autocomplete="off">
          </label>
          <label class="field">
            <span>Room code</span>
            <input type="text" id="join-code" placeholder="ABC123" maxlength="6" style="text-transform:uppercase; letter-spacing:2px;" required>
          </label>
          <button type="submit" class="btn btn-tonal">Join room</button>
        </form>
      </div>
    </section>

    <!-- ============================== ROOM ============================== -->
    <section id="room-view" class="room" hidden>
      <div class="stage">
        <div class="video-wrap">
          <video id="player"></video>
          <div id="video-empty" class="video-empty">
            <svg viewBox="0 0 24 24" class="video-empty-icon"><path d="M8 5v14l11-7Z"/></svg>
            <p>Add a video to start</p>
          </div>

          <div id="chat-hint" class="chat-hint" hidden>Press <kbd>Enter</kbd> to chat</div>

          <!-- Chat lives on top of the video itself, bottom-left, and stays
               out of the way — a persistent, ambient message log like a
               streaming-party overlay. Enter reveals the input right below
               it without covering the rest of the video. -->
          <div id="chat-dock" class="chat-dock">
            <div class="chat-dock-log" id="chat-log"></div>
            <div id="typing-indicator" class="typing-indicator" hidden></div>
            <div id="emoji-tray" class="emoji-tray" hidden></div>
            <form id="chat-form" class="chat-input-row" hidden>
              <button type="button" id="emoji-toggle" class="icon-btn" title="Emotes (Ctrl+E)" aria-label="Emotes">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8Zm3.5-9a1.5 1.5 0 1 0-1.5-1.5A1.5 1.5 0 0 0 15.5 11Zm-7 0A1.5 1.5 0 1 0 7 9.5 1.5 1.5 0 0 0 8.5 11Zm3.5 6.5a5.5 5.5 0 0 0 5-3.2.75.75 0 0 0-.68-1.06H7.68a.75.75 0 0 0-.68 1.06 5.5 5.5 0 0 0 5 3.2Z"/></svg>
              </button>
              <input type="text" id="chat-input" placeholder="Message the room…" autocomplete="off">
              <button type="submit" class="btn btn-filled btn-small">Send</button>
            </form>
          </div>
        </div>

        <div id="bottom-bar" class="bottom-bar">
          <div class="stage-toolbar">
            <input type="text" id="video-url" class="url-input" placeholder="Paste a video link…">
            <button id="add-queue-btn" class="btn btn-filled">Add to queue</button>
            <button id="skip-btn" class="icon-btn" title="Skip to next in queue" aria-label="Skip">
              <svg viewBox="0 0 24 24"><path d="M6 6v12l8.5-6ZM16 6v12h2V6Z"/></svg>
            </button>
            <button id="queue-toggle-btn" class="btn btn-outlined" aria-expanded="false">
              Queue <span id="queue-count" class="queue-count-badge">0</span>
            </button>
          </div>
          <div id="progress-row" class="progress-row" hidden>
            <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
            <span id="progress-label">0%</span>
          </div>
          <div id="queue-panel" class="queue-panel" hidden>
            <div id="queue-list" class="queue-list"></div>
            <p id="queue-empty" class="queue-empty">Nothing queued yet — add a link above.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ============================ SETTINGS ============================ -->
  <div id="settings-dialog" class="dialog-scrim" hidden>
    <div class="dialog dialog-settings" role="dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>

      <div class="settings-body">
        <div class="settings-nav" id="settings-nav">
          <button type="button" class="settings-nav-item is-active" data-panel="appearance">Appearance</button>
          <button type="button" class="settings-nav-item" data-panel="profile">Profile</button>
          <button type="button" class="settings-nav-item" data-panel="downloads">Downloads</button>
          <button type="button" class="settings-nav-item" data-panel="discord">Discord</button>
          <button type="button" class="settings-nav-item" data-panel="connection">Connection</button>
          <button type="button" class="settings-nav-item" data-panel="emotes">Emotes</button>
        </div>

        <div class="settings-panels">

          <div class="settings-panel" data-panel="appearance">
            <label class="field">
              <span>Theme</span>
              <div class="segmented" id="theme-toggle">
                <button type="button" data-theme-value="dark">Dark</button>
                <button type="button" data-theme-value="light">Light</button>
              </div>
            </label>

            <label class="field">
              <span>Color theme</span>
              <div class="scheme-swatches" id="scheme-swatches">
                <button type="button" class="scheme-swatch" data-preset="asuka" title="Asuka" style="background:#B3401F"></button>
                <button type="button" class="scheme-swatch" data-preset="lilith" title="Lilith" style="background:#873E47"></button>
                <button type="button" class="scheme-swatch" data-preset="sartre" title="Sartre" style="background:#FFEC65"></button>
                <button type="button" class="scheme-swatch" data-preset="fouco" title="Fouco" style="background:#83FCFF"></button>
                <button type="button" class="scheme-swatch" data-preset="kallen" title="Kallen" style="background:#F99FE3"></button>
                <button type="button" class="scheme-swatch" data-preset="green" title="Green" style="background:#AEFA87"></button>
                <button type="button" class="scheme-swatch" data-preset="morphean" title="Morphean Paradox" style="background:#465189"></button>
                <button type="button" class="scheme-swatch" data-preset="miku" title="Miku" style="background:#37C0D1"></button>
              </div>
              <div class="field-row">
                <button type="button" id="import-theme-btn" class="btn btn-outlined btn-small">Import JSON…</button>
                <button type="button" id="reset-theme-btn" class="btn btn-text btn-small">Reset to default</button>
              </div>
              <span class="field-hint">Or bring your own — a flat JSON file of hex colors, e.g. <code>{"--md-primary": "#B3401F"}</code>.</span>
            </label>

            <label class="field">
              <span>Background image URL</span>
              <input type="text" id="setting-background-url" placeholder="https://link-to-image (leave blank for none)">
            </label>

            <label class="field">
              <span>Background blur — <span id="blur-amount-label">24px</span></span>
              <input type="range" id="setting-blur-amount" min="0" max="50" value="24">
            </label>

            <label class="field field-checkbox">
              <input type="checkbox" id="setting-parallax">
              <span>Cursor-based parallax on the background</span>
            </label>
          </div>

          <div class="settings-panel" data-panel="profile" hidden>
            <label class="field">
              <span>Avatar image URL</span>
              <input type="text" id="setting-avatar-url" placeholder="https://link-to-image">
              <span class="field-hint">Shown next to your name in the participants list.</span>
            </label>
          </div>

          <div class="settings-panel" data-panel="downloads" hidden>
            <label class="field">
              <span>Video download folder</span>
              <div class="field-row">
                <input type="text" id="setting-dir">
                <button type="button" id="browse-dir-btn" class="btn btn-outlined btn-small">Browse</button>
              </div>
            </label>
          </div>

          <div class="settings-panel" data-panel="discord" hidden>
            <label class="field">
              <span>Discord webhook URL</span>
              <input type="text" id="setting-webhook" placeholder="https://discord.com/api/webhooks/…">
              <span class="field-hint">Room chat gets posted here (host only).</span>
            </label>
          </div>

          <div class="settings-panel" data-panel="connection" hidden>
            <label class="field">
              <span>Supabase project URL</span>
              <input type="text" id="setting-supabase-url" placeholder="https://xxxxx.supabase.co">
            </label>

            <label class="field">
              <span>Supabase anon public key</span>
              <input type="text" id="setting-supabase-key" placeholder="eyJhbGciOi…">
              <span class="field-hint">See README for setup.</span>
            </label>
          </div>

          <div class="settings-panel" data-panel="emotes" hidden>
            <label class="field">
              <span>Custom emotes</span>
              <div class="field-row">
                <input type="text" id="custom-emoji-name" placeholder="name" class="emote-name-input">
                <input type="text" id="custom-emoji-url" placeholder="https://link-to-image">
                <button type="button" id="add-custom-emoji-btn" class="btn btn-outlined btn-small">Add</button>
              </div>
              <span class="field-hint">
                Ctrl+E in chat to use one. Also editable by hand — <code id="emotes-file-path">…</code>
                <button type="button" id="reload-emotes-btn" class="link-btn">reload</button>
              </span>
            </label>
            <div id="custom-emoji-list" class="custom-emoji-list"></div>
          </div>

        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="settings-cancel" class="btn btn-text">Cancel</button>
        <button type="button" id="settings-save" class="btn btn-filled">Save</button>
      </div>
    </div>
  </div>

  <div id="snackbar" class="snackbar" hidden></div>

</div>
<script src="renderer.js"></script>
</body>
</html>
